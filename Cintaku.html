<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Forever With Aurelia 💖</title>

<style>
body{
margin:0;
font-family:'Comic Sans MS',cursive;
text-align:center;
background:radial-gradient(circle at top,#ff9a9e,#fad0c4,#ffdde1);
color:white;
overflow:hidden;
}

.container{
margin-top:40px;
animation:fade 1.5s ease-in-out;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

button{
padding:12px 25px;
border:none;
border-radius:30px;
background:white;
color:#ff4d6d;
font-weight:bold;
cursor:pointer;
margin:10px;
transition:0.3s;
}

button:hover{
transform:scale(1.15);
}

img{
width:250px;
border-radius:20px;
margin:10px;
box-shadow:0 0 25px pink;
}

#loveBar{
width:70%;
height:22px;
background:white;
margin:auto;
border-radius:20px;
}

#loveFill{
height:100%;
width:0%;
background:#ff4d6d;
border-radius:20px;
transition:1s;
}

.heart{
position:absolute;
animation: float 6s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);}
100%{transform:translateY(-10vh);}
}

.firework{
position:absolute;
font-size:30px;
animation:boom 1s ease-out forwards;
}

@keyframes boom{
from{opacity:1;transform:scale(0);}
to{opacity:0;transform:scale(3);}
}

.bigText{
font-size:40px;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{text-shadow:0 0 10px white;}
to{text-shadow:0 0 30px pink;}
}

</style>
</head>
<body>

<audio autoplay loop>
<source src="music.mp3" type="audio/mp3">
</audio>

<div class="container" id="game">
<h1>✨ Love Story Quest ✨</h1>
<p>Special For Aurelia 💖</p>
<button onclick="start()">Start The Magic 💕</button>
</div>

<br>
<div id="loveBar"><div id="loveFill"></div></div>
<p>Love Meter 💘</p>

<script>

let love=0;
let clickCount=0;

document.body.addEventListener("click",()=>{
clickCount++;
if(clickCount===3){
alert("Rahasia Terbuka 😳💖 Kamu adalah alasan aku bahagia setiap hari.");
}
});

function addLove(){
love+=20;
document.getElementById("loveFill").style.width=love+"%";
}

function start(){
document.getElementById("game").innerHTML=`
<h2>Tebak-Tebakan Romantis 🤣</h2>
<p>Kenapa aku nggak jadi dokter?</p>
<button onclick="r1()">Kenapa?</button>
`;
}

function r1(){
addLove();
document.getElementById("game").innerHTML=`
<p>Karena tiap lihat kamu jantungku nggak normal 😭💓</p>
<button onclick="r2()">Lanjut 😂</button>
`;
}

function r2(){
document.getElementById("game").innerHTML=`
<p>Apa bedanya kamu sama WiFi?</p>
<button onclick="r2a()">Apa?</button>
`;
}

function r2a(){
addLove();
document.getElementById("game").innerHTML=`
<p>Kalau WiFi kadang hilang sinyal…<br>
Kalau kamu? Selalu nyambung ke hatiku 💕📶</p>
<button onclick="gallery()">Next 💖</button>
`;
}

function gallery(){
addLove();
document.getElementById("game").innerHTML=`
<h2>Kenangan Kita 📸</h2>
<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">
<br>
<button onclick="countdown()">Final Surprise 😳</button>
`;
}

function countdown(){
let count=5;
document.getElementById("game").innerHTML=`<h1 class="bigText" id="count">${count}</h1>`;
let interval=setInterval(()=>{
count--;
document.getElementById("count").innerHTML=count;
if(count==0){
clearInterval(interval);
proposal();
}
},1000);
}

function proposal(){
document.getElementById("game").innerHTML=`
<h1 class="bigText">💍 Aurelia 💍</h1>
<p>Di antara miliaran manusia…<br>
Aku pilih kamu.<br><br>
Mau nggak jadi pacarku selamanya?</p>
<button onclick="yes()">MAU BANGETTT 😭💖</button>
<button onclick="no()">Nggak 😜</button>
`;
}

function yes(){
document.getElementById("game").innerHTML=`
<h1 class="bigText">I LOVE YOU FOREVER ❤️</h1>
<p>Kamu adalah rumahku, alasanku, dan masa depanku 💕</p>
`;
fireworks();
}

function no(){
alert("Jawaban salah 😜 karena takdirnya kamu sama aku 💖");
}

function createHeart(){
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="💖";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=Math.random()*20+20+"px";
document.body.appendChild(heart);
setTimeout(()=>{heart.remove();},6000);
}
setInterval(createHeart,500);

function fireworks(){
for(let i=0;i<40;i++){
let fw=document.createElement("div");
fw.className="firework";
fw.innerHTML="✨";
fw.style.left=Math.random()*100+"vw";
fw.style.top=Math.random()*100+"vh";
document.body.appendChild(fw);
setTimeout(()=>{fw.remove();},1000);
}
}

</script>

</body>
</html>
